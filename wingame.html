<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>窗台羽语 · 上海清晨</title>
<style>
  :root{
    --ink:#2f2416; --ink2:#6d5b41;
    --paper:#f4e8cf; --paper2:#fdf7e8; --paper3:#ecdbba;
    --bd:#43301c; --bd2:#8a6a45; --tan:#c9a97c;
    --accent:#a8452e; --green:#6b8f52; --teal:#5f8f88;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
    padding:14px;
  }
  .game{
    max-width:960px; margin:0 auto; background:var(--paper);
    border:3px solid var(--bd); border-radius:3px;
    box-shadow:inset 0 0 0 2px #fdf7e8, 0 5px 0 rgba(67,48,28,.22), 0 16px 34px rgba(28,18,9,.16);
  }
  /* ---- 顶栏 ---- */
  .gbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:8px 12px; border-bottom:3px solid var(--bd); flex-wrap:wrap;
    background:linear-gradient(#fdf7e8, #f0e0c2);
  }
  .gstat{display:flex; align-items:center; gap:11px; flex-wrap:wrap}
  .gp{
    display:inline-flex; align-items:center; gap:5px;
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  }
  .gp i{
    font-style:normal; font-size:9px; font-weight:700; letter-spacing:1px; color:#fff5e2;
    background:var(--accent); border:2px solid var(--bd); border-radius:2px;
    padding:0 3px; position:relative; top:-1px;
  }
  .gp b{font-size:20px; font-weight:800; letter-spacing:.5px; font-variant-numeric:tabular-nums}
  .glv{font-size:11.5px; letter-spacing:1px; color:var(--ink2)}
  .glv b{font-family:ui-monospace,monospace; font-size:13px; color:var(--ink)}
  .gprog{
    width:92px; height:9px; background:var(--paper3); border:2px solid var(--bd);
    position:relative; overflow:hidden; border-radius:2px;
  }
  .gprog i{position:absolute; inset:0 auto 0 0; width:0%; background:var(--green); box-shadow:inset 0 1px 0 rgba(255,255,255,.35); transition:width .3s}
  .gnext{font-size:10.5px; color:var(--ink2); letter-spacing:.5px}
  .gbtns{display:flex; gap:6px; flex-wrap:wrap}
  .gbtns button{
    font-family:inherit; font-size:12px; letter-spacing:1px; cursor:pointer;
    padding:5px 10px; border:2px solid var(--bd); background:var(--paper2); color:var(--ink);
    border-radius:7px; box-shadow:0 2px 0 var(--bd), inset 0 1px 0 #fffdf4;
    transition:transform .06s, background .15s;
  }
  .gbtns button:hover{background:#fffdf4}
  .gbtns button:active{transform:translateY(2px); box-shadow:0 0 0 var(--bd)}
  .gbtns button:disabled{opacity:.45; cursor:not-allowed; box-shadow:0 2px 0 rgba(67,48,28,.3)}
  .gbtns button.on{background:var(--accent); color:#fff6e2; border-color:var(--bd)}
  /* ---- 画面 ---- */
  .gscr{position:relative; background:#cfe2da; line-height:0; border-bottom:3px solid var(--bd)}
  canvas{display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; cursor:default}
  .panel{
    position:absolute; inset:0; display:none; flex-direction:column;
    background:var(--paper2); line-height:1.6;
  }
  .panel.open{display:flex}
  .phead{
    display:flex; align-items:center; padding:8px 14px;
    border-bottom:3px solid var(--bd);
    background:linear-gradient(#f9f1dc, #eddcbc);
  }
  #pclose{margin-left:auto}
  .phead b{
    font-size:13px; letter-spacing:3px; color:#fff6e4;
    background:var(--bd); padding:2px 10px; border-radius:2px;
  }
  .phead small{font-family:ui-monospace,monospace; font-size:10px; color:var(--ink2); letter-spacing:1px; margin-left:8px}
  .phead button{
    border:2px solid var(--bd); background:var(--paper2); width:24px; height:24px; border-radius:7px;
    font-size:14px; line-height:1; cursor:pointer; color:var(--ink); box-shadow:0 2px 0 var(--bd);
  }
  #pbody{padding:8px 14px 16px; overflow:auto; flex:1; -webkit-overflow-scrolling:touch}
  .sect{
    font-size:10.5px; letter-spacing:2px; color:var(--ink2);
    margin:12px 0 6px; padding-bottom:3px; border-bottom:2px dotted rgba(67,48,28,.3);
  }
  .panel::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:22px; pointer-events:none;
    background:linear-gradient(rgba(253,247,232,0), rgba(253,247,232,.95));
  }
  .row{
    display:flex; align-items:center; gap:9px; padding:6px 9px; margin:5px 0;
    border:2px solid rgba(67,48,28,.45); background:#fffdf4; border-radius:2px;
  }
  .row .nm{font-size:12.5px; flex:1 1 auto; min-width:0}
  .row .nm b{font-weight:700; letter-spacing:.5px}
  .row .nm span{display:block; font-size:10.5px; color:var(--ink2); letter-spacing:.3px; margin-top:1px}
  .row .pr{font-family:ui-monospace,monospace; font-size:11.5px; color:var(--accent); white-space:nowrap; font-weight:700}
  .row button{
    font-family:inherit; font-size:11.5px; padding:3px 9px; cursor:pointer; border-radius:7px;
    border:2px solid var(--bd); background:var(--paper2); color:var(--ink); white-space:nowrap;
    box-shadow:0 2px 0 var(--bd);
  }
  .row button:hover:not(:disabled){background:#fffdf4}
  .row button:active:not(:disabled){transform:translateY(2px); box-shadow:0 0 0 var(--bd)}
  .row button:disabled{opacity:.4; cursor:not-allowed; box-shadow:0 2px 0 rgba(67,48,28,.28)}
  .row.done .pr{color:var(--ink2)}
  .cg{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
  .cg.f{grid-template-columns:repeat(4,1fr)}
  .ci{
    border:2px solid rgba(67,48,28,.45); border-radius:2px; padding:6px 4px 5px; text-align:center;
    font-size:10.5px; letter-spacing:.3px; color:var(--ink); background:#fffdf4;
  }
  .ci i{display:block; width:100%; height:6px; margin-bottom:5px; border-radius:1px; background:rgba(67,48,28,.14)}
  .ci.lock{color:#a2947a; background:#f4ead4; border-style:dashed}
  .ci.got{border-color:var(--bd)}
  /* ---- 番茄钟 / 备忘 ---- */
  .pomo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:6px 0 4px;min-height:100%}
  .pomo .pp{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:46px;font-weight:800;
    letter-spacing:2px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
  .pomo .pst{font-size:10.5px;letter-spacing:3px;color:var(--ink2)}
  .pomo .pbtns{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  .pomo .pbtns button,.memo button{
    font-family:inherit;font-size:12px;padding:5px 13px;cursor:pointer;border-radius:7px;
    border:2px solid var(--bd);background:var(--paper2);color:var(--ink);box-shadow:0 2px 0 var(--bd);
  }
  .pomo .pbtns button:active,.memo button:active{transform:translateY(2px);box-shadow:0 0 0 var(--bd)}
  .pomo .pbtns button.on{background:var(--accent);color:#fff6e2}
  .pomo .pday{
    width:100%;margin-top:4px;padding:9px 12px;text-align:center;background:#fffdf4;
    border:2px solid rgba(67,48,28,.45);border-radius:2px;font-size:12px;letter-spacing:.5px;
  }
  .pomo .pday b{font-family:ui-monospace,monospace;font-size:22px;color:var(--accent);letter-spacing:0}
  .pomo .pday span{display:block;margin-top:2px;font-size:10.5px;color:var(--ink2);letter-spacing:.6px}
  /* 表盘：像一台黄铜气压计，剩多少一眼看得出 */
  .pomo .pdial{position:relative;width:172px;height:172px;margin:4px 0 2px}
  .pomo .pdial svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .pomo .pdial .pdtrk{fill:none;stroke:rgba(58,42,26,.13);stroke-width:5}
  .pomo .pdial .pdarc{fill:none;stroke:#b08d4f;stroke-width:5;stroke-linecap:round}
  .pomo .pdial .pdin{fill:#fdf8ea;stroke:rgba(58,42,26,.20);stroke-width:1}
  .pomo .pdial .pp{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:27px;letter-spacing:1px;text-shadow:0 1px 0 #fffdf4;
  }
  .memo .row2{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--ink2);letter-spacing:.5px}
  .memo textarea{
    width:100%;min-height:158px;margin-top:4px;resize:vertical;padding:10px 11px;outline:none;
    font-family:inherit;font-size:12.5px;line-height:1.95;color:var(--ink);
    background:#fffdf4;border:2px solid rgba(67,48,28,.45);border-radius:2px;
  }
  .memo textarea:focus{border-color:var(--bd);background:#fffef8}
  /* ---- 底栏 ---- */
  .gfoot{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:8px 12px; background:linear-gradient(#f7eeda, #f1e2c5);
  }
  .seeds{display:flex; gap:5px; flex-wrap:wrap}
  .seed{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    font-family:inherit; font-size:11.5px; letter-spacing:.3px; color:var(--ink);
    border:2px solid var(--bd); background:var(--paper2); padding:3px 8px; border-radius:2px;
    box-shadow:0 2px 0 rgba(67,48,28,.55);
  }
  .seed:active{transform:translateY(2px); box-shadow:0 0 0 rgba(67,48,28,.55)}
  .seed em{width:9px; height:9px; border-radius:1px; display:inline-block; font-style:normal; border:1px solid rgba(0,0,0,.3)}
  .seed.sel{background:var(--bd); color:#fff6e4; border-color:var(--bd)}
  .seed.lock{opacity:.38; cursor:not-allowed; box-shadow:0 2px 0 rgba(67,48,28,.25)}
  .hint{font-size:10.5px; letter-spacing:.3px; color:var(--ink2)}
  /* ---- 提示 ---- */
  .toast{
    position:absolute; left:50%; top:14px; transform:translate(-50%,-8px);
    background:#33402c; color:#f8f2df; font-size:12px; letter-spacing:1px;
    padding:6px 14px; border:2px solid #1d2618; border-radius:2px;
    box-shadow:0 3px 0 rgba(20,26,16,.4);
    opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; white-space:nowrap; line-height:1.4;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  @media (max-width:640px){
    body{padding:8px}
    .gbar{padding:7px 9px; gap:6px}
    .gp b{font-size:17px}
    .gprog{width:54px; height:8px}
    .gnext{display:none}
    .gbtns button{padding:4px 7px; font-size:11px; letter-spacing:0}
    .hint{display:none}
    .gfoot{padding:7px 9px; display:block}
    .seeds{flex-wrap:nowrap; overflow-x:auto; width:100%; -webkit-overflow-scrolling:touch}
    .seeds::-webkit-scrollbar{display:none}
    .seed{flex:0 0 auto}
    .cg{grid-template-columns:repeat(3,1fr)}
    .cg.f{grid-template-columns:repeat(3,1fr)}
    .phead{padding:7px 11px}
    #pbody{padding:6px 11px 14px}
    .row{padding:5px 7px; gap:7px}
  }

  /* =========================================================
     欧式复古外观：胡桃木 + 黄铜 + 羊皮纸（覆盖上面的基础样式）
     ========================================================= */
  :root{
    --ink:#3a2a1a; --ink2:#77603f;
    --paper:#efe3c9; --paper2:#f8f1de; --paper3:#e3d2ae;
    --bd:#3a2a1a; --bd2:#8a6f45; --tan:#c2a173;
    --accent:#8c3b2e; --green:#4c6647; --teal:#5a7f78;
    --brass:#b08d4f; --brassL:#dcc07f; --walnut:#5a3a22;
  }
  body{font-family:Georgia,"Times New Roman","Songti SC",STSong,"Noto Serif SC",serif}
  .game{
    background:
      repeating-linear-gradient(0deg, rgba(120,90,50,.045) 0 1px, transparent 1px 3px),
      radial-gradient(120% 90% at 50% 0%, #f8f1de, var(--paper) 60%, #e5d5b6);
    box-shadow:
      inset 0 0 0 1px var(--brass),
      inset 0 0 0 4px #f7efdb,
      inset 0 0 0 5px rgba(58,42,26,.34),
      0 6px 0 rgba(58,42,26,.22), 0 18px 36px rgba(28,18,9,.18);
  }
  .gbar{
    background:linear-gradient(#f9f2e0,#eee0c1);
    border-bottom:2px solid var(--bd);
    box-shadow:inset 0 -1px 0 var(--brass), inset 0 1px 0 #fffdf6;
  }
  .gp i{background:var(--walnut); border-color:var(--bd); color:#f6e8c8; font-family:Georgia,serif}
  .gprog{background:#e6d7b8; border-color:var(--bd); border-radius:2px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.55), inset 0 1px 2px rgba(58,42,26,.18)}
  .gprog i{background:linear-gradient(#dcc07f,#b08d4f); box-shadow:inset 0 1px 0 #f0dcaa}
  .glv b{font-family:Georgia,serif}
  .gbtns button{
    font-family:Georgia,serif; letter-spacing:1.6px; font-variant:small-caps;
    background:linear-gradient(#fdf8ea,#efe1c2);
    border:2px solid var(--bd); border-radius:3px;
    box-shadow:inset 0 0 0 1px rgba(176,141,79,.55), inset 0 1px 0 #fffdf4,
               inset 0 -2px 0 rgba(58,42,26,.10), 0 2px 0 rgba(58,42,26,.55);
  }
  .gbtns button:hover{background:linear-gradient(#fffdf4,#f5e9cf)}
  .gbtns button.on{
    background:linear-gradient(#a2472f,#8c3b2e); color:#fbeed2;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 2px 0 var(--bd);
  }
  .panel{
    background:
      repeating-linear-gradient(0deg, rgba(120,90,50,.035) 0 1px, transparent 1px 3px),
      radial-gradient(120% 100% at 50% 0%, #fcf6e5, var(--paper2) 58%, #eee0c1);
    box-shadow:inset 0 0 0 1px rgba(58,42,26,.18);
  }
  .phead{
    background:linear-gradient(#f5e9cc,#e7d5b0);
    border-bottom:2px solid var(--bd);
    box-shadow:inset 0 -1px 0 var(--brass), inset 0 1px 0 #fffdf6;
  }
  .phead b{
    background:var(--walnut); color:#f7e9c9; letter-spacing:4px;
    border:1px solid var(--brass); font-variant:small-caps;
  }
  .phead small{font-family:Georgia,serif; letter-spacing:1.4px}
  .row,.ci,.pomo .pday,.memo textarea{
    background:#fcf6e7; border:1px solid rgba(58,42,26,.35);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.55), 0 1px 0 rgba(58,42,26,.10);
  }
  .row button,.pomo .pbtns button,.memo button{
    font-family:Georgia,serif; letter-spacing:1.2px; font-variant:small-caps;
    background:linear-gradient(#fcf6e7,#efe1c2);
    box-shadow:inset 0 1px 0 #fffdf4, 0 2px 0 var(--bd);
  }
  .row button:hover:not(:disabled),.pomo .pbtns button:hover,.memo button:hover{background:linear-gradient(#fffdf4,#f5e9cf)}
  .pomo .pp{font-family:Georgia,"Times New Roman",serif; letter-spacing:1px}
  .pomo .pbtns button.on{background:linear-gradient(#a2472f,#8c3b2e); color:#fbeed2}
  .seed{
    background:linear-gradient(#fcf6e7,#efe1c2);
    box-shadow:0 2px 0 rgba(58,42,26,.5), inset 0 1px 0 #fffdf4;
    letter-spacing:.6px;
  }
  .seed.sel{background:linear-gradient(#7d4a2c,#5a3a22); box-shadow:0 2px 0 rgba(58,42,26,.5), inset 0 0 0 1px var(--brass)}
  .gfoot{
    background:linear-gradient(#f7edd5,#e9daba);
    box-shadow:inset 0 1px 0 var(--brass), inset 0 -6px 12px rgba(58,42,26,.05);
  }
  .toast{
    background:#3e5340; border:2px solid #24331f;
    box-shadow:0 3px 0 rgba(20,26,16,.35), inset 0 0 0 1px rgba(200,170,110,.55);
    font-style:italic; letter-spacing:1.2px;
  }
  .sect{font-style:italic; letter-spacing:1.8px; color:#7a6444}
  .hint{font-style:italic; letter-spacing:.4px}
  /* 备忘：摊开的横线本，纸面撑满整块面板 */
  .memo{display:flex;flex-direction:column;min-height:100%}
  .memo textarea{
    flex:1;line-height:28px;font-size:13px;padding:8px 12px 10px;border-radius:2px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0) 0 27px, rgba(120,96,58,.16) 27px 28px),
      linear-gradient(#fdf9ec, #fbf3e1);
  }
  .memo textarea::placeholder{font-style:italic;color:#a08c68}
  .panel::after{background:linear-gradient(rgba(252,246,231,0), rgba(252,246,231,.96))}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="gbar">
    <div class="gstat">
      <span class="gp"><i>P</i><b id="pts">0</b></span>
      <span class="glv">Lv.<b id="lv">1</b></span>
      <div class="gprog"><i id="bar"></i></div>
      <span class="gnext" id="next">下一级 60</span>
    </div>
    <div class="gbtns">
      <button id="btnUp">升级</button>
      <button id="btnShop">商店</button>
      <button id="btnColl">图鉴</button>
      <button id="btnPomo" title="番茄钟 · 记录今日专注">番茄钟</button>
      <button id="btnMemo" title="桌上的笔记本">备忘</button>
      <button id="btnFast" class="on" title="演示加速，游戏内时间 ×3">×3</button>
      <button id="btnSnd" title="音效">♪</button>
    </div>
  </div>

  <div class="gscr" id="scr">
    <canvas id="cv" width="320" height="180"></canvas>
    <div class="panel" id="panel">
      <div class="phead"><b id="ptitle">商店</b><small id="psub"></small><button id="pclose">×</button></div>
      <div id="pbody"></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="gfoot">
    <div class="seeds" id="seeds"></div>
    <div class="hint">点羽毛收点 · 选中花种后点空花盆 · 开花再点收获</div>
  </div>
</div>

<script>
/* =========================================================
   《窗台羽语 · 上海清晨》 —— 320×180 像素放置 Demo
   全部美术由 Canvas 逐像素绘制，无外部图片与字体素材。
   数值取自设计文档：鸟 10 种 / 花 8 种 / 10 级 / P 为统一点数。
   ========================================================= */
(function () {
  'use strict';

  var CV = document.getElementById('cv');
  var ctx = CV.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  var W = 320, H = 180;
  var SILL = 152;             // 台面前缘：鸟的落脚线
  var POT_BASE = 149;         // 花盆坐在台面靠前处
  var POT_X = [48, 96, 144];  // 花盆中心（围成靠窗的一丛）
  var POT_W = 36, POT_H = 30;
  var POT_TOP = POT_BASE - POT_H;
  var PERCH = [72, 120, 172, 202, 232];

  /* ---------- 数据 ---------- */
  var BIRDS = [
    { id:'sparrow',  name:'麻雀',     lv:1, w:35,  stay:8,  n:1, pts:1,  body:'#8b6b46', wing:'#6d5236', belly:'#e8dcc2', head:'#7a5c3c', beak:'#3a3226' },
    { id:'bulbul',   name:'白头鹎',   lv:1, w:25,  stay:10, n:1, pts:2,  body:'#8d9282', wing:'#6f7d6c', belly:'#f4f0e2', head:'#2b3229', beak:'#4a3a2a', nape:1 },
    { id:'dove',     name:'珠颈斑鸠', lv:2, w:15,  stay:12, n:2, pts:2,  body:'#b0878e', wing:'#8b6a62', belly:'#e9d5c9', head:'#b9bec5', beak:'#3d3531', big:1 },
    { id:'blackbird',name:'乌鸫',     lv:3, w:10,  stay:9,  n:1, pts:4,  body:'#2c2b28', wing:'#1d1d1b', belly:'#33322e', head:'#2c2b28', beak:'#e0a63c' },
    { id:'magpie',   name:'喜鹊',     lv:4, w:6,   stay:7,  n:1, pts:6,  body:'#f2eee0', wing:'#25301c', belly:'#f2eee0', head:'#25301c', beak:'#25301c', tail:1 },
    { id:'azure',    name:'灰喜鹊',   lv:5, w:4,   stay:8,  n:1, pts:5,  body:'#cfd8cf', wing:'#5f9b96', belly:'#e8ece2', head:'#25301c', beak:'#25301c', tail:1 },
    { id:'wagtail',  name:'白鹡鸰',   lv:6, w:3,   stay:6,  n:1, pts:4,  body:'#e8e6d8', wing:'#9aa39c', belly:'#f6f3e6', head:'#6c7570', beak:'#3a3226' },
    { id:'hoopoe',   name:'戴胜',     lv:7, w:1.2, stay:10, n:1, pts:8,  body:'#d9a06a', wing:'#f0d9b5', belly:'#e8c39a', head:'#d9a06a', beak:'#4a3a2a', crest:1 },

  /* ---------- 3×5 像素字（仅数字与少量符号） ---------- */
  var GLYPH = {
    '0':[7,5,5,5,7], '1':[2,6,2,2,7], '2':[7,1,7,4,7], '3':[7,1,7,1,7],
    '4':[5,5,7,1,1], '5':[7,4,7,1,7], '6':[7,4,7,5,7], '7':[7,1,1,1,1],

  function pxText(str, x, y, color, sc) {
    sc = sc || 1;
    ctx.fillStyle = color;
    var cx = x;
    for (var i = 0; i < str.length; i++) {
      var g = GLYPH[str[i]];
      if (!g) { cx += 4 * sc; continue; }
      for (var r = 0; r < 5; r++) {
        var bits = g[r];
        for (var c = 0; c < 3; c++) {
          if (bits & (4 >> c)) ctx.fillRect(cx + c * sc, y + r * sc, sc, sc);
        }
      }
      cx += 4 * sc;
    }
  }

  /* ---------- 绘制：背景 ---------- */
  function px(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }

  function dither(y0, y1, colA) {
    ctx.fillStyle = colA;

  /* 四行递进的抖动，把两条天空色接缝揉软，不至于是一条直线 */
  function ramp(y, colB) {

  function nz(i) { var v = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); }

  function drawSky() {
    px(0, 0, W, 26, C.sky1);
    px(0, 26, W, 32, C.sky2);
    px(0, 58, W, 30, C.sky3);
    px(0, 88, W, 47, C.sky4);
    ramp(24, C.sky2);
    ramp(56, C.sky3);
    ramp(86, C.sky4);
    /* 云底透下来的一线暖光，落在山脊上 */
    var x, y;
    for (y = 92; y < 108; y++) {
      for (x = 0; x < W; x++) {
        if ((x * 3 + y * 5) % 7 < 2) px(x, y, 1, 1, 'rgba(255,240,208,.15)');
      }
    }
  }

  /* ---------- 层云：压得低低的那种长条云 ---------- */
  var CLOUDS = [
    [8, 16, 7, 138], [162, 11, 8, 118], [26, 36, 5, 96], [206, 40, 6, 104],
    [88, 27, 4, 74], [246, 24, 5, 74], [0, 53, 4, 118], [176, 58, 4, 92],
    [40, 68, 6, 150], [210, 70, 5, 110]
  ];
  function drawClouds() {
    var i, d, x, y, t, th;
    for (i = 0; i < CLOUDS.length; i++) {
      d = CLOUDS[i];
      for (x = d[0]; x < d[0] + d[3] && x < W; x++) {
        t = (x - d[0]) / d[3];
        th = Math.sin(t * Math.PI) * d[2] * (0.72 + 0.42 * Math.sin(x * 0.055 + i * 1.7));
        if (th <= 0) continue;
        for (y = 0; y < Math.ceil(th * 2); y++) {
          if (nz(x * 1.9 + y * 2.4 + i * 4.1) < (y < th ? 0.22 : 0.62)) continue;
          px(x, d[1] + y, 1, 1, y < th ? 'rgba(255,253,244,.52)' : 'rgba(176,188,190,.26)');
        }
      }
    }
  }

  /* ---------- 丘陵：三层，越远越淡 ---------- */
  function ridgeH(x, amp, seed) {
    return Math.round(amp * (0.55 + 0.45 * Math.sin(x * 0.011 + seed))
      + amp * 0.35 * Math.sin(x * 0.027 + seed * 2.1)
      + amp * 0.18 * Math.sin(x * 0.061 + seed * 0.7));
  }
  function ridge(yBase, amp, col, colL, seed) {
    var x, y0;
    for (x = 0; x < W; x++) {
      y0 = yBase - ridgeH(x, amp, seed);
      px(x, y0, 1, 135 - y0, col);
      px(x, y0, 1, 1, colL);
    }
  }
  function drawRidges() {
    var i, x, y0;
    ridge(92, 9, C.ridgeFar, C.ridgeFarL, 1.3);
    ridge(100, 7, C.ridgeMid, C.ridgeMidL, 3.7);
    /* 中景丘陵上一排矮树，像英格兰山脊上的防风林 */
    var CUP = [[14, 7], [34, 6], [58, 8], [96, 6], [124, 7], [168, 6],
               [196, 8], [232, 6], [268, 7], [296, 6]];
    for (i = 0; i < CUP.length; i++) {
      x = CUP[i][0];
      y0 = 100 - ridgeH(x, 7, 3.7);
      disc(x, y0 + 1, CUP[i][1], C.ridgeMid);
      disc(x, y0 + 1, CUP[i][1] - 2, C.ridgeMidL);

  /* ---------- 牧场：几道老树篱把地分开，再点几只羊 ---------- */
  function drawFields() {
    var i, x, yy;
    for (i = 0; i < 2; i++) {
      for (x = 0; x < W; x++) {
        yy = 96 + i * 5 + Math.round(Math.sin(x * 0.02 + i * 2) * 2);
        if (nz(x * 2.3 + i * 7.7) < 0.16) continue;          /* 断断续续，像长了多年的老篱 */
        px(x, yy, 1, 1, C.hedge);
        if (nz(x * 4.1 + i * 3.3) > 0.55) px(x, yy - 1, 1, 1, C.hedgeL);
      }
    }
    /* 更远处的地界石墙：细细一条，把牧场切成几块 */
    for (i = 0; i < 2; i++) {
      for (x = 0; x < W; x++) {
        yy = 91 + i * 6 + Math.round(Math.sin(x * 0.014 + i * 1.1) * 2);
        if (nz(x * 1.9 + i * 4.4) < 0.25) continue;

  /* ---------- 荒原：石楠、金雀花、枯草混在一起 ---------- */
  /* 注意：窗框的下横档画在 126..135，会盖住背景，景物一律排在 126 以上 */
  function drawMoor() {
    var x, y, top, n, d, i, k;
    for (x = 0; x < W; x++) {
      top = 106 - ridgeH(x, 6, 0.6);
      px(x, top, 1, 126 - top, C.moor);
    }
    /* 草皮：4×2 的小块噪声才像草地；越近越暗，压出纵深 */
    for (y = 98; y < 126; y++) {
      d = (y - 98) / 28;
      for (x = 0; x < W; x++) {
        top = 106 - ridgeH(x, 6, 0.6);
        if (y < top) continue;
        /* 山脊到荒原的四行过渡，别让两种土色直接对切 */
        if (y - top < 3 && nz(x * 3.7 + y * 1.3) > (y - top) / 3) {
          px(x, y, 1, 1, C.ridgeNear);
          continue;
        }
        n = nz((x >> 2) * 1.31 + (y >> 1) * 2.77);
        if (n > 0.78) px(x, y, 1, 1, C.moorL);
        else if (n > 0.615) px(x, y, 1, 1, C.moorD);
        if (nz(x * 0.5 + y * 3.1) < d * 0.42) px(x, y, 1, 1, 'rgba(46,40,22,.20)');
      }
    }
    /* 大块的草色变化：不放这一层，整片荒原就是一块平涂的土黄 */
    var P = [[30, 110, 40, 7, 'rgba(112,128,74,.30)'], [120, 116, 46, 6, 'rgba(196,178,124,.26)'],
             [210, 111, 38, 6, 'rgba(104,120,70,.26)'], [280, 117, 34, 6, 'rgba(196,178,124,.22)'],
             [70, 121, 44, 4, 'rgba(120,134,80,.22)'], [180, 122, 40, 4, 'rgba(112,128,74,.20)']];
    for (i = 0; i < P.length; i++) ell(P[i][0], P[i][1], P[i][2], P[i][3], P[i][4]);

    /* 蕨丛：锈褐色的一片一片 */
    var BR = [[16, 114, 17, 3], [64, 116, 21, 3], [124, 117, 15, 3],
              [176, 115, 19, 3], [232, 117, 15, 3], [296, 116, 14, 3]];
    for (i = 0; i < BR.length; i++)
      ell(BR[i][0], BR[i][1], BR[i][2], BR[i][3], 'rgba(150,106,60,.45)');

    /* 石楠：实心的小土丘，顶上一层浅色，不是平铺的紫点 */
    var H = [[26, 115, 20, 4], [82, 116, 24, 4], [142, 114, 14, 3],
             [198, 116, 22, 4], [256, 115, 18, 4], [304, 116, 14, 3]];
    for (i = 0; i < H.length; i++) {
      ell(H[i][0], H[i][1], H[i][2], H[i][3], '#6b5464');
      ell(H[i][0] - 2, H[i][1] - 1, H[i][2] - 5, H[i][3] - 1, '#7d6478');
      ell(H[i][0] - 4, H[i][1] - 2, H[i][2] - 10, H[i][3] - 2, '#8d7086');
      for (k = 0; k < 12; k++) {
        x = H[i][0] - H[i][2] + Math.round(nz(i * 3.7 + k) * H[i][2] * 2);
        y = H[i][1] - H[i][3] - 1 + Math.round(nz(i * 7.1 + k * 2.3) * 2);
        px(x, y, 1, 1, k % 3 ? C.heather : C.heatherL);
      }
    }
    /* 草簇：短竖线，让地面有绒感 */
    for (i = 0; i < 90; i++) {
      x = Math.round(nz(i * 3.3) * W);
      y = 108 + Math.round(nz(i * 8.7) * 16);
      if (y < 106 - ridgeH(x, 6, 0.6)) continue;
      px(x, y - 2, 1, 2, 'rgba(126,138,84,.55)');
      if (nz(i * 5.9) > 0.6) px(x + 1, y - 1, 1, 1, 'rgba(146,158,104,.42)');
    }
    /* 通向豁口的一条土路 */
    for (y = 116; y < 126; y++) {
      x = 156 + Math.round(Math.sin((y - 116) * 0.26) * 3 - (y - 116) * 0.12);
      px(x, y, 5, 1, 'rgba(176,164,122,.42)');
      px(x + 1, y, 3, 1, 'rgba(196,186,146,.30)');
    }

    for (i = 0; i < 18; i++) {
      x = Math.round(nz(i * 5.3) * W);
      y = 112 + Math.round(nz(i * 9.1) * 10);
      if (y < 106 - ridgeH(x, 6, 0.6)) continue;
      px(x, y, 1, 1, C.gorse);
      if (nz(i * 2.7) > 0.45) px(x + 1, y, 1, 1, 'rgba(198,164,65,.7)');
      if (nz(i * 6.1) > 0.7) px(x, y - 1, 1, 1, 'rgba(198,164,65,.55)');
    }
  }

  /* ---------- 远处的石屋与小教堂 ---------- */
  function cottage(x, y, w, h) {
    var i, inset, rh = Math.round(w * 0.5);
    px(x, y, w, h, C.stoneWall);
    px(x, y, 1, h, 'rgba(255,253,244,.32)');
    px(x + w - 1, y, 1, h, 'rgba(38,36,30,.26)');
    for (i = 0; i < rh; i++) {
      inset = Math.round((rh - i) * (w / 2) / rh);
      px(x - 1 + inset, y - rh + i, w + 2 - inset * 2, 1, i < 2 ? C.slateL : C.slate);
      /* 石板的横缝 */
      if (i > 2 && i % 3 === 0)
        px(x - 1 + inset, y - rh + i, w + 2 - inset * 2, 1, 'rgba(28,34,32,.16)');
    }
    px(x - 1, y, w + 2, 1, 'rgba(40,40,34,.32)');
    /* 烟囱：按屋顶的坡面找落点，别浮在屋脊上面 */
    var cc = x + w - 6;
    var d = Math.min(cc - (x - 1), (x + w) - (cc + 2));
    var ct = y - rh + Math.ceil(rh * (1 - d / (w / 2)));
    px(cc, ct - 4, 3, 5, C.stoneWall);
    px(cc, ct - 4, 3, 1, C.slate);
    px(cc, ct - 4, 1, 5, 'rgba(255,253,244,.3)');
    px(x + 2, y + 2, 2, 3, 'rgba(58,64,58,.92)');        /* 窗 */
    if (w > 14) px(x + w - 6, y + 2, 2, 3, 'rgba(58,64,58,.92)');
  }

  function church(x, base, h) {
    var i, w;
    px(x, base - h, 8, h, C.stoneWall);
    px(x, base - h, 1, h, 'rgba(255,253,244,.36)');
    px(x + 7, base - h, 1, h, 'rgba(38,36,30,.28)');
    px(x + 3, base - h + 4, 2, 4, 'rgba(50,56,50,.88)');
    for (i = 0; i < 8; i++) {
      w = Math.max(1, 8 - i);
      var sx0 = Math.round(x + 3.5 - w / 2);
      px(sx0, base - h - 8 + i, w, 1, C.slate);
      px(sx0, base - h - 8 + i, 1, 1, C.slateL);         /* 迎光的一侧 */
    }
    px(x + 3, base - h - 11, 1, 3, 'rgba(58,64,58,.85)');
    px(x + 2, base - h - 10, 3, 1, 'rgba(58,64,58,.85)');
  }

  function drawHamlet() {
    /* 先点几丛山楂与石头，给这片地一个尺度 */
    var B = [[62, 116, 6], [98, 114, 5], [136, 117, 5], [172, 115, 6],
             [226, 116, 5], [292, 115, 6]];

    for (i = 0; i < B.length; i++) {

  /* ---------- 干砌石墙：一层层乱石错缝砌起来 ---------- */
  function drawWall() {
    var x, y0, row, col, bx, sw, i;
    var GREY = ['#9b978a', '#8a8679', '#767266', '#635f55'];
    /* 先铺一条随地势起伏的墙体底色，石缝就透出这个深色 */
    for (x = -1; x < W; x++) {
      y0 = 127 + Math.round(Math.sin(x * 0.019 + 0.8) * 1.4);
      if (x > 148 && x < 161) continue;                      /* 豁口 */
      px(x, y0 - 9, 1, 9, '#7e7a6d');
      px(x, y0 + 1, 1, 2, 'rgba(30,26,16,.42)');             /* 墙根影 */
    }
    /* 四层石头，每层起头的位置都不同，缝就不会竖着连成一条线 */
    for (row = 0; row < 4; row++) {
      bx = -8 + row * 3;
      while (bx < W + 6) {
        sw = 2 + Math.round(nz(bx * 3.1 + row * 13.7) * 7);   /* 宽 2~9 */
        if (!(bx > 145 && bx < 164)) {
          y0 = 127 + Math.round(Math.sin(bx * 0.019 + 0.8) * 1.4) - 1 - row * 2;
          col = GREY[Math.floor(nz(bx * 1.7 + row * 5.3) * 3.9) % 4];
          px(bx, y0 - 1, sw, 2, col);
          px(bx, y0 - 1, sw, 1, 'rgba(255,252,240,.15)');     /* 石面上一线光 */
          px(bx + sw - 1, y0 - 1, 1, 2, 'rgba(36,32,22,.22)');/* 侧缝压暗 */
        }
        bx += sw;
      }
    }
    /* 墙头草皮：一溜深绿，把墙和后面分开 */
    for (x = -1; x < W; x++) {
      y0 = 127 + Math.round(Math.sin(x * 0.019 + 0.8) * 1.4);
      if (x > 148 && x < 161) continue;
      px(x, y0 - 9, 1, 1, nz(x * 2.7) > 0.45 ? 'rgba(104,118,72,.85)' : 'rgba(126,138,92,.7)');
    }
    /* 豁口两侧的门柱 */
    px(147, 114, 3, 14, '#8f8b7d');
    px(161, 114, 3, 14, '#8f8b7d');
    px(147, 114, 3, 1, '#bdb9aa');
    px(161, 114, 3, 1, '#bdb9aa');
    px(148, 115, 1, 13, '#ada99a');
    px(162, 115, 1, 13, '#ada99a');
    px(147, 116, 3, 11, 'rgba(34,30,20,.10)');
    px(161, 116, 3, 11, 'rgba(34,30,20,.10)');
    px(146, 129, 6, 2, 'rgba(30,26,16,.36)');
    px(160, 129, 6, 2, 'rgba(30,26,16,.36)');
    /* 墙头长的草 */
    for (i = 0; i < 30; i++) {
      x = Math.round(nz(i * 4.7) * W);
      if (x > 145 && x < 164) continue;
      y0 = 127 + Math.round(Math.sin(x * 0.019 + 0.8) * 1.4);
      px(x, y0 - 10, 1, 1, 'rgba(126,138,92,.62)');
    }
  }

  /* ---------- 窗根下的几丛荒草：只露一个尖，压在画面最前面 ---------- */
  function drawScrub() {
    var B = [[12, 130, 7], [52, 131, 6], [108, 130, 7], [168, 131, 5],
             [218, 130, 6], [272, 131, 6], [300, 130, 6]];
    var i, k, x;
    for (i = 0; i < B.length; i++) {
      disc(B[i][0], B[i][1], B[i][2], '#57623f');
      disc(B[i][0], B[i][1] - 1, B[i][2] - 2, '#6c7a52');
      px(B[i][0] - 1, B[i][1] - B[i][2], 1, 1, '#87956a');
    }
    for (k = 0; k < 26; k++) {
      x = Math.round(nz(k * 6.1) * W);
      var h = 2 + Math.round(nz(k * 2.9) * 3);
      px(x, 128 - h, 1, h, 'rgba(112,124,82,.6)');
    }
  }

  /* 一棵长在窗外的树：左边树冠密，往右上收出画面 */
  var CLUSTERS = [
    [4, 22, 26], [36, 10, 26], [72, 18, 28], [108, 8, 26], [144, 16, 26],
    [178, 8, 22], [206, 20, 20], [232, 10, 16],
    [282, 6, 15], [303, 24, 11],
    [12, 42, 18], [48, 36, 20], [84, 44, 20], [120, 36, 20], [156, 42, 20],
    [188, 36, 18], [214, 46, 15],
    [22, 58, 14], [56, 54, 15], [92, 62, 14], [128, 54, 14], [162, 62, 13],
    [194, 56, 12],
    [36, 72, 11], [72, 74, 9], [104, 70, 11]
  ];

  /* 叶团并成一张遮罩，边缘按角度抖一抖，才不会看成一球一球 */
  var CMASK = new Uint8Array(W * 130);

  function inMask(x, y) {
    if (x < 0 || x >= W || y < 0 || y >= 130) return 0;
    return CMASK[y * W + x];
  }

  function buildMask() {
    var i, k, x, y, c, dx, dy, a, ai, a0, a1, at, r, rad, jit;
    for (i = 0; i < CLUSTERS.length; i++) {
      c = CLUSTERS[i];
      rad = [];
      for (k = 0; k < 24; k++) rad[k] = c[2] * (0.86 + nz(i * 7.3 + k) * 0.26);
      var x0 = Math.max(0, Math.floor(c[0] - c[2] * 1.2));
      var x1 = Math.min(W - 1, Math.ceil(c[0] + c[2] * 1.2));
      var y0 = Math.max(0, Math.floor(c[1] - c[2] * 1.2));
      var y1 = Math.min(129, Math.ceil(c[1] + c[2] * 1.2));
      for (y = y0; y <= y1; y++) {
        for (x = x0; x <= x1; x++) {
          dx = x - c[0]; dy = y - c[1];
          a = Math.atan2(dy, dx);
          ai = (a + Math.PI) / (Math.PI * 2) * 24;
          a0 = Math.floor(ai) % 24; a1 = (a0 + 1) % 24; at = ai - Math.floor(ai);
          r = rad[a0] * (1 - at) + rad[a1] * at;
          /* 边缘再抖 1~2px，破掉正圆 */
          jit = (nz(x * 1.31 + y * 2.77) - 0.5) * 3;
          if (dx * dx + dy * dy <= (r + jit) * (r + jit)) CMASK[y * W + x] = 1;
        }
      }
    }
  }

  function drawCanopy() {
    var x, y, n, m, col;
    for (y = 0; y < 130; y++) {
      for (x = 0; x < W; x++) {
        if (!CMASK[y * W + x]) continue;
        col = C.leaf2;
        if (!inMask(x, y - 2)) col = C.leaf4;                     /* 朝上的叶面，被太阳照透 */
        else if (!inMask(x + 3, y - 2)) col = C.leaf3;            /* 偏右侧一层 */
        else if (!inMask(x - 1, y + 2) || !inMask(x, y + 3)) col = C.leaf1;  /* 下缘阴影 */
        else {
          n = nz((x >> 1) * 1.7 + (y >> 1) * 3.1);
          m = nz((x >> 2) * 4.3 + (y >> 2) * 2.7);
          if (n > 0.8 || m > 0.76) col = C.leaf3;
          else if (n < 0.2 || m < 0.24) col = C.leaf1;
        }
        px(x, y, 1, 1, col);
      }
    }
    /* 上亮下暗：越靠下越沉 */
    var d;
    for (y = 44; y < 130; y++) {
      d = (y - 44) / 44;
      if (d > 1) d = 1;
      for (x = 0; x < W; x++) {
        if (!CMASK[y * W + x]) continue;
        if (nz(x * 0.7 + y * 1.9) < d * 0.55) px(x, y, 1, 1, 'rgba(20,46,28,.30)');
      }
    }
    /* 叶隙：几处透光的小洞 */
    var i, hx, hy;
    for (i = 0; i < 7; i++) {
      hx = 30 + Math.round(nz(i * 4.1) * 130);
      hy = 16 + Math.round(nz(i * 6.9) * 48);
      if (inMask(hx, hy) && inMask(hx - 3, hy) && inMask(hx + 3, hy) &&
          inMask(hx, hy - 3) && inMask(hx, hy + 3))
        px(hx, hy, 1, 1, C.sky3);
    }
  }

  /* 树冠里透出来的枝：只画在叶子里，像被叶子挡了一半 */
  function branch(x0, y0, x1, y1, w0, w1) {
    var len = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
    var n = Math.ceil(len), i, j, k, t, cx, cy, r;
    for (i = 0; i <= n; i++) {
      t = i / n;
      cx = Math.round(x0 + (x1 - x0) * t);
      cy = Math.round(y0 + (y1 - y0) * t);
      r = (w0 + (w1 - w0) * t) / 2;
      for (j = -Math.ceil(r); j <= Math.ceil(r); j++) {
        for (k = -Math.ceil(r); k <= Math.ceil(r); k++) {
          if (j * j + k * k > r * r) continue;
          if (!inMask(cx + k, cy + j)) continue;
          px(cx + k, cy + j, 1, 1, 'rgba(52,40,26,.5)');
        }
      }
    }
  }

  function drawBranches() {
    var B = [
      [86, 92, 62, 66, 5, 2], [62, 68, 44, 42, 2, 1],
      [86, 92, 110, 62, 5, 2], [110, 64, 130, 40, 2, 1],
      [87, 94, 148, 58, 4, 2], [148, 60, 170, 36, 2, 1],
      [100, 70, 86, 44, 3, 1], [196, 50, 212, 30, 2, 1]
    ];
    for (var i = 0; i < B.length; i++)
      branch(B[i][0], B[i][1], B[i][2], B[i][3], B[i][4], B[i][5]);
  }

  /* 远处蒙一层空气，把丘陵和石屋压到后面去（石墙不蒙，留作近景） */
  function drawHaze() {
    var x, y;
    for (y = 86; y < 120; y++) {
      for (x = 0; x < W; x++) {
        if ((x + y) % 2) continue;
        if (nz(x * 0.9 + y * 1.7) < 0.55) px(x, y, 1, 1, 'rgba(226,232,220,.13)');
      }
    }
  }

  /* 光斑：太阳穿过叶子，在树冠上留下的几团亮 */
  var DAPPLE = [[150, 22, 8], [182, 34, 6], [120, 12, 5], [204, 28, 5],
                [96, 30, 4], [162, 48, 4], [64, 18, 4]];

  function drawDapple() {
    var i, d, dx, dy, r, n;
    for (i = 0; i < DAPPLE.length; i++) {
      d = DAPPLE[i];
      r = d[2];
      for (dy = -r; dy <= r; dy++) {
        for (dx = -r; dx <= r; dx++) {
          n = dx * dx + dy * dy;
          if (n > r * r) continue;
          if (!inMask(d[0] + dx, d[1] + dy)) continue;
          if (nz((d[0] + dx) * 2.3 + (d[1] + dy) * 5.1) > (n < (r - 2) * (r - 2) ? 0.55 : 0.85))
            px(d[0] + dx, d[1] + dy, 1, 1, C.leaf4);
        }
      }
    }
  }

  /* 一截从粗到细的枝干 */
  function limb(x0, y0, x1, y1, w0, w1, col) {
    var n = Math.ceil(Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0)));
    ctx.fillStyle = col;
    for (var i = 0; i <= n; i++) {
      var t = i / n;
      var cx = x0 + (x1 - x0) * t, cy = y0 + (y1 - y0) * t;
      var r = (w0 + (w1 - w0) * t) / 2;
      ctx.fillRect(Math.round(cx - r), Math.round(cy - r),
                   Math.max(1, Math.round(r * 2)), Math.max(1, Math.round(r * 2)));
    }
  }

  function drawTree() {
    /* 主干：从台面下长上来，上端钻进树冠里 */
    limb(88, 130, 86, 90, 17, 12, C.bark);
    /* 分叉 */
    limb(86, 94, 56, 70, 8, 5, C.bark);
    limb(56, 72, 38, 52, 5, 3, C.bark);
    limb(86, 94, 118, 72, 8, 5, C.bark);
    limb(118, 74, 142, 56, 5, 3, C.bark);
    limb(87, 96, 100, 66, 7, 4, C.bark);
    limb(100, 68, 110, 48, 4, 2, C.bark);

    /* 受光面 / 背光面 */
    limb(85, 128, 81, 94, 5, 3, C.barkL);
    limb(92, 128, 90, 96, 5, 3, C.barkD);

    /* 树皮的竖纹 */
    for (var i = 0; i < 16; i++) {
      var gy = 92 + Math.round(nz(i * 3.1) * 36);
      var gx = 79 + Math.round(nz(i * 7.7) * 12);
      px(gx, gy, 1, 2 + Math.round(nz(i) * 4), 'rgba(46,36,24,.22)');
    }

    /* 爬在树干上的青苔 */
    var moss = [[82, 120, 4], [90, 114, 3], [80, 106, 3], [91, 100, 3], [84, 94, 3]];
    for (i = 0; i < moss.length; i++) {
      px(moss[i][0], moss[i][1], moss[i][2], 2, C.moss);
      px(moss[i][0], moss[i][1], moss[i][2] - 1, 1, C.mossL);
    }
  }

  /* ---------- 木纹小工具 ---------- */
  function hash(n) { var v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }

  function grainH(x, y, w, col, seed) {
    ctx.fillStyle = col;
    var cx = x, i = 0;
    while (cx < x + w) {
      var len = 2 + Math.floor(hash(seed + i * 1.7) * 7);
      var end = Math.min(cx + len, x + w);
      if (end > cx) ctx.fillRect(cx | 0, y | 0, (end - cx) | 0, 1);
      cx = end + 3 + Math.floor(hash(seed + i * 3.1) * 7);
      i++;
    }
  }

  function grainV(x, y, h, col, seed) {
    ctx.fillStyle = col;
    var cy = y, i = 0;
    while (cy < y + h) {
      var len = 3 + Math.floor(hash(seed + i * 1.9) * 8);
      var end = Math.min(cy + len, y + h);
      if (end > cy) ctx.fillRect(x | 0, cy | 0, 1, (end - cy) | 0);
      cy = end + 3 + Math.floor(hash(seed + i * 2.6) * 8);
      i++;
    }
  }

  /* 木节：同心的小圈 */
  function knot(x, y) {
    px(x, y, 5, 1, 'rgba(74,48,28,.30)');
    px(x + 1, y - 1, 3, 1, 'rgba(74,48,28,.20)');
    px(x + 1, y + 1, 3, 1, 'rgba(74,48,28,.20)');
    px(x + 2, y, 1, 1, 'rgba(38,24,13,.45)');
  }

  /* 长木纹：横贯板面、微微起伏的一条线 */
  function wavy(y, col, amp, seed) {
    ctx.fillStyle = col;
    for (var x = 0; x < W; x++) {
      var yy = y + Math.round(Math.sin(x * 0.045 + seed * 2.3) * amp + Math.sin(x * 0.011 + seed) * 1.1);
      ctx.fillRect(x, yy, 1, 1);
    }
  }

  function drawFrame() {
    /* 竖框：木色 + 竖向木纹 + 内缘受光 */
    function stile(x) {
      px(x, 0, 12, 135, C.wood);
      px(x, 0, 1, 135, C.woodDD);
      px(x + 1, 0, 1, 135, C.woodL);
      px(x + 11, 0, 1, 135, C.woodD);
      px(x + 10, 0, 1, 135, 'rgba(206,166,120,.22)');
      for (var i = 0; i < 13; i++) {
        var gx = x + 3 + Math.floor(hash(i * 2.7 + x) * 6);
        var gy = Math.floor(hash(i * 5.1 + x) * 100);
        grainV(gx, gy, 8 + Math.floor(hash(i * 3.9 + x) * 30), 'rgba(58,38,22,.20)', i + x);
      }
    }
    stile(0); stile(W - 12);

    /* 顶框 */
    px(0, 0, W, 9, C.wood);
    px(0, 0, W, 2, C.woodL);
    px(0, 2, W, 1, 'rgba(206,166,120,.45)');
    px(0, 7, W, 1, 'rgba(196,158,92,.5)');
    px(0, 8, W, 1, C.woodD);
    px(0, 9, W, 1, 'rgba(0,0,0,.30)');
    grainH(0, 4, W, 'rgba(58,38,22,.26)', 5);

    /* 窗扇下框（横档） */
    px(0, 126, W, 9, C.wood);
    px(0, 126, W, 1, '#8a6040');
    px(0, 127, W, 1, C.woodL);
    px(0, 134, W, 1, C.woodD);
    grainH(0, 130, W, 'rgba(58,38,22,.22)', 21);

    /* 左框上的两枚铜合页 */
    function hinge(y) {
      px(11, y, 3, 6, '#a98b52');
      px(11, y, 3, 1, '#c8ab6e');
      px(12, y + 2, 1, 1, '#6f5a30');
      px(12, y + 4, 1, 1, '#6f5a30');
      px(11, y + 6, 3, 1, 'rgba(40,28,14,.35)');
    }
    hinge(30); hinge(70);
  }

  /* 窗台：一条厚木板，台面压得很薄、前缘给足厚度，才有透视 */
  function drawSill() {
    /* 台面主色 */
    px(0, 135, W, 17, '#9d6d3b');

    /* 后段吃窗框的影，前段受光 */
    px(0, 135, W, 2, 'rgba(30,18,10,.32)');
    dither(136, 139, 'rgba(30,18,10,.10)');
    dither(147, 151, 'rgba(228,180,134,.10)');

    /* 木纹：长而缓的横纹 + 两个木节 */
    wavy(140, 'rgba(54,33,18,.20)', 1, 1.7);
    wavy(143, 'rgba(54,33,18,.14)', 1, 4.1);
    wavy(147, 'rgba(54,33,18,.11)', 1, 0.9);
    wavy(150, 'rgba(54,33,18,.08)', 1, 2.9);
    wavy(145, 'rgba(236,194,148,.10)', 0, 2.4);
    knot(58, 143); knot(228, 148); knot(168, 139);

    /* 两端压暗，别让木板看起来是无限长的一条 */
    for (var e = 0; e < 20; e++) {
      var a = 0.18 * (1 - e / 20);
      px(e, 135, 1, 18, 'rgba(26,15,8,' + a.toFixed(3) + ')');
      px(W - 1 - e, 135, 1, 18, 'rgba(26,15,8,' + a.toFixed(3) + ')');
    }

    /* 与窗框的接缝 */
    px(0, 135, W, 1, 'rgba(24,14,8,.55)');
    px(0, 136, W, 1, 'rgba(196,158,92,.55)');
    px(0, 136, W, 1, 'rgba(212,174,132,.12)');

    /* 前缘的倒角：被天光打亮的一线，嵌一道黄铜条 */
    px(0, 152, W, 1, '#d8b878');
    px(0, 151, W, 1, 'rgba(196,158,92,.45)');

    /* 前缘立面：压暗，和台面拉开 */
    px(0, 153, W, 11, '#6c4828');
    px(0, 153, W, 1, '#845d38');
    wavy(157, 'rgba(28,16,8,.16)', 0, 3.3);
    wavy(161, 'rgba(28,16,8,.11)', 0, 6.2);
    px(0, 162, W, 3, '#48301a');
    for (var e2 = 0; e2 < 20; e2++) {
      var a2 = 0.20 * (1 - e2 / 20);
      px(e2, 153, 1, 11, 'rgba(20,12,6,' + a2.toFixed(3) + ')');
      px(W - 1 - e2, 153, 1, 11, 'rgba(20,12,6,' + a2.toFixed(3) + ')');
    }

    /* 台下：室内，暗下去，把亮处衬出来（胡桃木的暗调，别发青） */
    px(0, 164, W, 16, '#4b4638');
    px(0, 164, W, 2, 'rgba(10,12,8,.34)');
    dither(166, 172, 'rgba(10,12,8,.10)');
    px(0, 174, W, 6, '#3d382c');
    dither(171, 174, 'rgba(10,12,8,.08)');

    /* 护墙板的压顶线脚：一明一暗两条就够，不画嵌板免得像贴上去的方块 */
    px(0, 166, W, 1, 'rgba(196,158,92,.20)');
    px(0, 167, W, 1, 'rgba(10,12,8,.30)');
    px(0, 173, W, 1, 'rgba(10,12,8,.22)');
  }

  /* 台面上的水珠（从窗外带进来的雨水/露水） */
  var DROPS = [[22,142],[64,148],[96,145],[112,139],[152,149],[186,141],[214,147],[244,143],[276,138],[300,146]];
  function drawDrops() {
    for (var i = 0; i < DROPS.length; i++) {
      var x = DROPS[i][0], y = DROPS[i][1];
      px(x, y - 1, 1, 1, 'rgba(251,247,234,.55)');
      px(x - 1, y, 3, 1, 'rgba(226,238,236,.75)');
      px(x, y + 1, 1, 1, 'rgba(120,130,110,.35)');
    }
  }

  /* ---------- 台面上的几盆装饰植物：不能种，纯摆设 ---------- */
  function leaf(cx, cy, w, h, c1, c2) {
    for (var dy = 0; dy < h; dy++) {
      var ww = Math.max(1, Math.round(w * Math.sin((dy + 1) / (h + 1) * Math.PI)));
      px(cx - (ww >> 1), cy + dy, ww, 1, c1);
    }
    px(cx, cy + 1, 1, h - 2, c2);
  }

  function blade(x0, y0, h, lean, c1, c2) {
    for (var i = 0; i < h; i++) {
      var t = i / h;
      var x = Math.round(x0 + lean * t * t);
      var w = (t > 0.82 || t < 0.12) ? 1 : 2;
      var c = (i % 5 === 2) ? c2 : c1;
      px(x, y0 - i, w, 1, c);
      if (w > 1) px(x + 1, y0 - i, 1, 1, (i % 5 === 2) ? c1 : c2);
    }
  }

  function drawDecor() {
    /* 左：奶油釉小盆 + 一丛阔叶 */
    var px0 = 21, pb = 149;
    px(px0 - 7, pb - 9, 15, 2, '#f0e8d3');
    px(px0 - 6, pb - 7, 13, 6, '#dbd0b6');
    px(px0 - 6, pb - 7, 1, 6, '#f5efdb');
    px(px0 - 6, pb - 2, 13, 1, '#b6aa8e');
    px(px0 - 8, pb, 17, 1, 'rgba(37,48,28,.20)');
    px(px0 - 5, pb - 9, 11, 1, '#4a3826');

    /* 叶柄 */
    px(px0, pb - 15, 1, 6, '#4f7a46');
    px(px0 - 3, pb - 13, 1, 4, '#48703f');
    px(px0 + 3, pb - 13, 1, 4, '#48703f');

    leaf(px0 - 4, pb - 24, 7, 10, '#4f7a46', '#7aa860');
    leaf(px0 + 2, pb - 22, 7, 9, '#5f8f52', '#8aab5f');
    leaf(px0 - 7, pb - 20, 6, 8, '#48703f', '#6f9e58');
    leaf(px0 + 5, pb - 19, 6, 8, '#5f8f52', '#8aab5f');
    leaf(px0 - 3, pb - 17, 5, 6, '#6f9e58', '#8aab5f');
    leaf(px0 + 1, pb - 16, 5, 6, '#6f9e58', '#8aab5f');

    /* 右：米釉细盆 + 虎尾兰 */
    var sx = 261, sb = 149;
    px(sx - 7, sb - 10, 15, 2, '#ded2b6');
    px(sx - 6, sb - 8, 13, 7, '#b3a68a');
    px(sx - 6, sb - 8, 1, 7, '#e9e0c8');
    px(sx - 5, sb - 2, 11, 1, '#8a7d62');
    px(sx - 8, sb, 17, 1, 'rgba(37,48,28,.20)');
    px(sx - 5, sb - 10, 11, 1, '#4a3826');

    blade(sx - 4, sb - 10, 13, -3, '#4f7a46', '#7fa860');
    blade(sx - 1, sb - 10, 20, -1, '#3f6a3a', '#6f9e58');
    blade(sx + 2, sb - 10, 16, 1, '#4f7a46', '#7fa860');
    blade(sx + 4, sb - 10, 11, 3, '#5f8f52', '#8aab5f');
    blade(sx + 5, sb - 10, 8, 4, '#4f7a46', '#7fa860');
  }

  /* ---------- 小台灯：鹦鹉螺罩 + 铜臂 ---------- */
  function arc(cx, cy, r, a0, a1, col) {
    ctx.fillStyle = col;
    for (var a = a0; a < a1; a += 0.055) {
      ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1);
    }
  }

  function drawLamp(lx, base) {
    var sx = lx + 9, sy = base - 28;

    /* 灯罩漏出来的暖光（先铺，罩子压在上面） */
    ctx.globalAlpha = 0.13;
    disc(sx, sy + 4, 13, '#ffd68a');
    ctx.globalAlpha = 0.17;
    disc(sx, sy + 4, 7, '#ffd68a');
    ctx.globalAlpha = 1;
    px(sx - 9, base - 1, 26, 2, 'rgba(255,214,138,.10)');

    /* 底座：一根细柱铜座，省出台面的位置 */
    px(lx - 6, base + 1, 13, 1, 'rgba(37,48,28,.20)');
    px(lx - 5, base - 1, 11, 2, '#4a3018');
    px(lx - 4, base - 3, 9, 2, '#6b4728');
    px(lx - 3, base - 5, 7, 2, '#8a5f36');
    px(lx - 2, base - 5, 5, 1, '#c39a68');

    /* 弯杆：底下直、顶上往右拐，杆头要钻进罩子里，别在罩子下面断开 */
    for (var t = 0; t <= 1.001; t += 0.035) {
      var ax = Math.round(lx + 5 * t * t);
      var ay = Math.round(base - 5 - 24 * t);
      px(ax, ay, 2, 1, '#7d5530');
      px(ax, ay - 1, 1, 1, '#c39a68');
    }

    /* 罩子：经典喇叭形布罩，上窄下宽，比贝壳罩更容易读成灯 */
    var sTop = sy - 9, sBot = sy + 1, i, tt, ww;
    for (i = 0; i <= sBot - sTop; i++) {
      tt = i / (sBot - sTop);
      ww = Math.round(6 + tt * 7);                  /* 6 → 13 */
      px(sx - (ww >> 1), sTop + i, ww, 1, tt < 0.45 ? '#f2e3c6' : '#e8d5b0');
      px(sx - (ww >> 1), sTop + i, 1, 1, '#fff7e3');            /* 左缘受光 */
      px(sx + (ww >> 1) - 1, sTop + i, 1, 1, '#a8834f');        /* 右缘压暗 */
      if (i > 1) {                                  /* 布褶 */
        px(sx - 2, sTop + i, 1, 1, 'rgba(178,146,96,.30)');
        px(sx + 1, sTop + i, 1, 1, 'rgba(178,146,96,.24)');
      }
    }
    /* 灯口：下沿漏出的暖光，再压一道铜圈 */
    px(sx - 7, sBot, 15, 1, 'rgba(255,206,128,.60)');
    px(sx - 6, sBot + 1, 13, 1, 'rgba(255,190,104,.36)');
    px(sx - 6, sBot - 1, 13, 1, '#b98a45');
    /* 顶盖 + 铜球 */
    px(sx - 3, sTop - 1, 7, 1, '#b08d4f');
    px(sx - 2, sTop - 2, 5, 1, '#dcc07f');
    px(sx - 1, sTop - 4, 3, 2, '#c9a55f');
    px(sx, sTop - 5, 1, 1, '#efd79f');
  }

  /* 小茶杯（靠右，呼应参考图） */
  function drawCup(cx, base) {
    px(cx - 9, base - 4, 18, 1, '#eae5d4');
    px(cx - 10, base - 3, 20, 2, '#d9d3be');
    px(cx - 8, base - 1, 16, 1, '#b9b39e');
    px(cx - 7, base + 1, 14, 1, 'rgba(37,48,28,.16)');
    /* 杯身 */
    px(cx - 6, base - 11, 12, 1, '#f4f0e2');
    px(cx - 6, base - 10, 11, 8, '#eee9d8');
    px(cx + 4, base - 10, 1, 8, '#d5cfba');
    px(cx - 6, base - 3, 11, 1, '#e2dcc8');
    /* 茶汤 */
    px(cx - 5, base - 10, 10, 2, '#c1894a');
    px(cx - 4, base - 10, 8, 1, '#d8a35c');
    /* 把手 */
    px(cx + 5, base - 8, 2, 1, '#e6e0cc');
    px(cx + 6, base - 7, 1, 3, '#dbd5c0');
    px(cx + 5, base - 4, 2, 1, '#e6e0cc');
  }

  /* 顶框垂下来的两枝藤蔓（呼应参考图里的绿意） */
  function drawVine(x0, len, seed) {
    for (var i = 0; i < len; i++) {
      var x = x0 + Math.round(Math.sin(i * 0.24 + seed) * 3);
      px(x, 9 + i, 1, 1, '#4a6b3e');
      if (i > 2 && i % 7 === 3) {
        px(x - 3, 9 + i, 3, 2, '#5c8050');
        px(x - 2, 9 + i - 1, 2, 1, '#6d9a5b');
      }
      if (i > 4 && i % 9 === 1) {
        px(x + 1, 9 + i, 3, 2, '#4f7a46');
        px(x + 2, 9 + i - 1, 2, 1, '#5f8a54');
      }
    }
  }

  /* 玻璃上的斜光 */
  function drawGlass() {
    for (var i = 0; i < 26; i++) px(26 + i * 2, 14 + i, 5, 1, 'rgba(251,247,234,.055)');
    for (var j = 0; j < 18; j++) px(40 + j * 2, 40 + j, 3, 1, 'rgba(251,247,234,.04)');
    for (var k = 0; k < 20; k++) px(210 + k * 2, 18 + k, 4, 1, 'rgba(251,247,234,.035)');
  }

  /* 远处的两三只飞鸟 */
  function farBirds() {
    var t = Math.floor(tNow * 2) % 2;
    var bx = [140, 152, 236], by = [40, 34, 30], bs = [1, 0.8, 0.7];
    for (var i = 0; i < bx.length; i++) {
      var x = bx[i], y = by[i] + (t ? 0 : 1);
      ctx.fillStyle = 'rgba(37,48,28,.22)';
      ctx.fillRect(x, y, 1, 1);
      ctx.fillRect(x - 1, y - 1, 1, 1); ctx.fillRect(x + 1, y - 1, 1, 1);
      if (bs[i] > 0.9) { ctx.fillRect(x - 2, y - 2, 1, 1); ctx.fillRect(x + 2, y - 2, 1, 1); }
    }
  }

  /* ---------- 花：每种花一张小像素图 ---------- */
  function disc(cx, cy, r, col) {
    ctx.fillStyle = col;
    for (var dy = -r; dy <= r; dy++) {
      var w = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)));
      ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
    }
  }

  function bloom(f, gx, fy) {
    var i, a, j, ang;
    switch (f.id) {
      case 'sun':           /* 太阳花：一圈花瓣 + 棕色花心 */
        for (i = 0; i < 8; i++) {
          a = i * Math.PI / 4 + 0.4;
          px(gx + Math.round(Math.cos(a) * 4.2) - 1, fy + Math.round(Math.sin(a) * 4.2) - 1,
             3, 2, i % 2 ? '#f2c14a' : '#e0a636');
        }
        disc(gx, fy, 2, '#8a5f2a');
        px(gx - 1, fy - 1, 1, 1, '#6b4620');
        px(gx + 1, fy + 1, 1, 1, '#a5753a');
        break;

      case 'pansy':         /* 三色堇：上两瓣深紫、下瓣奶油、花心黄点 */
        px(gx - 4, fy - 5, 4, 3, '#7b4f9b');
        px(gx + 1, fy - 5, 4, 3, '#7b4f9b');
        px(gx - 3, fy - 4, 2, 1, '#9a6cba');
        px(gx + 2, fy - 4, 2, 1, '#9a6cba');
        px(gx - 5, fy - 2, 4, 3, '#b98fd0');
        px(gx + 2, fy - 2, 4, 3, '#b98fd0');
        px(gx - 3, fy + 1, 7, 3, '#f7efd4');
        px(gx - 2, fy + 4, 5, 1, '#e8dcc0');
        px(gx - 1, fy - 1, 3, 3, '#4e3d78');
        px(gx - 1, fy - 5, 3, 2, '#5f4287');
        px(gx, fy + 1, 1, 1, '#f2d24a');
        break;

      case 'jasmine':       /* 茉莉：五片白瓣，黄心 */
        for (i = 0; i < 5; i++) {
          a = i * Math.PI * 2 / 5 - Math.PI / 2;
          px(gx + Math.round(Math.cos(a) * 3.4) - 1, fy + Math.round(Math.sin(a) * 3.4) - 1, 3, 3, '#fbf8ee');
        }
        disc(gx, fy, 1, '#f0e2a0');
        px(gx, fy, 1, 1, '#e2c96a');
        break;

      case 'mint':          /* 薄荷：一小丛带叶脉的叶子 */
        var lv = [[0, -4], [4, -1], [-4, -1], [2, 3], [-2, 3]];
        for (i = 0; i < lv.length; i++) {
          px(gx + lv[i][0] - 2, fy + lv[i][1] - 1, 5, 3, '#6f9e58');
          px(gx + lv[i][0] - 1, fy + lv[i][1] - 2, 3, 1, '#8cb972');
          px(gx + lv[i][0], fy + lv[i][1], 1, 1, '#4f7a46');
        }
        px(gx - 1, fy - 1, 3, 3, '#4f7a46');
        break;

      case 'petunia':       /* 牵牛：正面的喇叭，五道放射浅纹 */
        disc(gx, fy, 4, '#7f83d8');
        disc(gx, fy, 3, '#9b9ee2');
        for (i = 0; i < 5; i++) {
          ang = i * Math.PI * 2 / 5 - Math.PI / 2;
          px(gx + Math.round(Math.cos(ang) * 2), fy + Math.round(Math.sin(ang) * 2), 1, 1, '#dedbf6');
          px(gx + Math.round(Math.cos(ang) * 3), fy + Math.round(Math.sin(ang) * 3), 1, 1, '#cfcbf0');
        }
        disc(gx, fy, 1, '#fbf8ff');
        break;

      case 'rose':          /* 月季：一层层往里收 */
        disc(gx, fy, 4, '#b8403b');
        disc(gx, fy, 3, '#d0665b');
        disc(gx + 1, fy, 1, '#a8332f');
        px(gx - 3, fy - 2, 2, 1, '#e0857a');
        px(gx - 2, fy, 3, 1, '#c14a42');
        px(gx - 1, fy + 2, 3, 1, '#a8332f');
        px(gx + 2, fy - 2, 2, 1, '#c85a50');
        break;

      case 'gardenia':      /* 栀子：六片厚白瓣 */
        for (i = 0; i < 6; i++) {
          a = i * Math.PI / 3;
          px(gx + Math.round(Math.cos(a) * 3.6) - 1, fy + Math.round(Math.sin(a) * 3.6) - 1, 3, 3, '#fbf7e6');
          px(gx + Math.round(Math.cos(a) * 4.6), fy + Math.round(Math.sin(a) * 4.6), 1, 1, '#efe8cf');
        }
        disc(gx, fy, 2, '#f4edd2');
        px(gx, fy, 1, 1, '#e8d98a');
        break;

      case 'succulent':     /* 多肉：一圈尖叶的莲座 */
        for (i = 0; i < 8; i++) {
          a = i * Math.PI / 4 + 0.2;
          px(gx + Math.round(Math.cos(a) * 3.5) - 1, fy + Math.round(Math.sin(a) * 3.5) - 1, 2, 2, i % 2 ? '#8fae86' : '#7fa077');
        }
        disc(gx, fy, 2, '#8fae86');
        disc(gx, fy, 1, '#6f9a6a');
        px(gx - 1, fy - 1, 1, 1, '#a9c39c');
        break;
    }
  }

  /* ---------- 绘制：花盆与花 ---------- */
  function drawPot(i) {
    if (i >= activePots()) return;
    var cx = POT_X[i], base = POT_BASE, top = POT_TOP;
    var pot = st.pots[i];

    /* 托盘：比盆底宽出一指，边缘受光 */
    px(cx - 16, base + 1, 32, 1, 'rgba(30,20,10,.28)');
    px(cx - 17, base - 5, 34, 1, '#d5a074');
    px(cx - 18, base - 4, 36, 2, '#b3744a');
    px(cx - 17, base - 2, 34, 1, '#8e5733');
    px(cx - 14, base - 1, 28, 1, '#6d4024');

    /* 口沿：一道厚唇，顶面受光、下面留暗槽 */
    px(cx - 15, top, 30, 1, '#d8a67a');
    px(cx - 14, top + 1, 28, 1, '#c08355');
    px(cx - 14, top + 2, 28, 2, '#a76842');
    px(cx - 14, top + 4, 28, 1, 'rgba(88,46,25,.55)');
    px(cx - 15, top + 1, 1, 1, 'rgba(234,192,152,.6)');

    /* 盆身：四道收分，左受光右背光 */
    var bands = [[6, 28], [5, 26], [5, 24], [4, 22]];
    var y = top + 5;
    for (var b = 0; b < bands.length; b++) {
      var bh = bands[b][0], bw = bands[b][1], bx = cx - (bw >> 1);
      px(bx, y, bw, bh, C.pot);
      px(bx, y, 1, bh, 'rgba(230,172,126,.45)');
      px(bx + 1, y, 1, bh, 'rgba(230,172,126,.18)');
      px(bx + bw - 2, y, 2, bh, 'rgba(105,58,34,.26)');
      y += bh;
    }
    px(cx - 11, base - 6, 22, 1, 'rgba(105,58,34,.35)');
    /* 陶土斑：让表面不至于一块死色 */
    px(cx - 9, top + 10, 6, 1, 'rgba(150,89,58,.20)');
    px(cx + 3, top + 16, 5, 1, 'rgba(150,89,58,.16)');
    px(cx - 6, top + 6, 4, 1, 'rgba(232,178,136,.35)');

    /* 土：比口沿低两像素，透出盆口的厚度 */
    px(cx - 12, top + 2, 24, 2, '#4a3826');
    px(cx - 12, top + 2, 24, 1, '#3a2b1d');
    px(cx - 12, top + 2, 1, 2, 'rgba(126,90,60,.45)');

    var f = pot.seed ? flowerOf(pot.seed) : null;
    var gx = cx, gy = top + 3;

    if (pot.phase === 'empty') {
      /* 土上的十字，提示可以种 */
      ctx.fillStyle = 'rgba(251,247,234,.8)';
      ctx.fillRect(gx - 1, gy + 1, 3, 1);
      ctx.fillRect(gx, gy, 1, 3);
      return;
    }

    if (pot.phase === 'grow') {
      var g = f.grow / (st.buff.pro > 0 ? 2 : 1);
      var k = clamp(pot.t / g, 0, 1);
      if (k < 0.3) {
        px(gx - 1, gy - 2, 2, 3, C.stem);
      } else if (k < 0.65) {
        px(gx, gy - 7, 1, 7, C.stem);
        px(gx - 4, gy - 6, 3, 2, C.leaf);
        px(gx + 2, gy - 8, 3, 2, C.leaf);
      } else {
        px(gx, gy - 12, 1, 12, C.stem);
        px(gx - 5, gy - 10, 4, 2, C.leaf);
        px(gx + 2, gy - 13, 4, 2, C.leaf);
        px(gx - 2, gy - 15, 5, 4, f.c);
        px(gx, gy - 16, 1, 1, 'rgba(251,247,234,.7)');
      }
      /* 生长条画在盆身上，不占天空 */
      px(cx - 10, base - 8, 20, 2, 'rgba(37,48,28,.2)');
      px(cx - 10, base - 8, Math.max(1, Math.round(20 * k)), 2, C.stem);
      return;
    }

    /* 开花 */
    var bob = Math.sin(tNow * 2 + i) > 0 ? 0 : -1;
    px(gx, gy - 16 + bob, 1, 16, C.stem);
    px(gx - 5, gy - 12, 4, 2, C.leaf);
    px(gx + 2, gy - 14, 4, 2, C.leaf);
    var fy = gy - 18 + bob;

    bloom(f, gx, fy);

    /* 可收获的微光 */
    var tw = (Math.sin(tNow * 4 + i * 2) + 1) * 0.5;
    if (tw > 0.72) px(gx + 4, fy - 3, 1, 1, 'rgba(251,247,234,.85)');
    if (tw < 0.2) px(gx - 6, fy + 2, 1, 1, 'rgba(251,247,234,.7)');
  }

  /* ---------- 绘制：鸟 ---------- */
  /* 一只胖雀：圆脑袋 + 蛋形身子合成「花生」剪影，尾巴是身体左缘长出的短楔子。
     剪影用圆/椭圆的解析式算行跨度，描边则用「同圆心、半径 +1」再算一遍，
     这样边缘是平滑的像素弧线，不会出现描边台阶。 */
  function makeSil(hr, brx, bry, hx, hy, bx, by) {
    var rows = [], y, a, b, w, dh, db;
    for (y = Math.floor(hy - hr); y <= Math.ceil(by + bry); y++) {
      a = null; b = null;
      db = (y - by) / bry;
      if (Math.abs(db) <= 1) {
        w = brx * Math.sqrt(1 - db * db);
        a = bx - w; b = bx + w;
      }
      dh = (y - hy) / hr;
      if (Math.abs(dh) <= 1) {
        w = hr * Math.sqrt(1 - dh * dh);
        a = a === null ? hx - w : Math.min(a, hx - w);
        b = b === null ? hx + w : Math.max(b, hx + w);
      }
      if (a === null) continue;
      rows.push([y, Math.round(a), Math.round(b)]);

  var HX = 4.5, HY = -17.6, HR = 4.7;
  var BX = 0, BY = -9.6, BRX = 7.1, BRY = 6.1;
  var BSIL = makeSil(HR, BRX, BRY, HX, HY, BX, BY);
  var BSILO = makeSil(HR + 1, BRX + 1, BRY + 1, HX, HY, BX, BY);

  function drawBird(b) {
    if (b.spec.id === 'dove') { drawDove(b); return; }
    var s = b.spec, f = b.face || 1;
    var fly = b.phase === 'in' || b.phase === 'out';
    var x = Math.round(b.x);
    var y = Math.round(b.y === undefined ? SILL : b.y);
    if (fly) y += Math.round(Math.sin(b.t * 11) * 1);
    else if (b.act !== 'walk') y += Math.sin(b.t * 2.1) > 0.6 ? -1 : 0;

    function row(r, a, c, col) {
      var xa = x + a * f, xb = x + c * f, t;
      if (xa > xb) { t = xa; xa = xb; xb = t; }

    function R(r) { for (var i = 0; i < BSIL.length; i++) if (BSIL[i][0] === r) return BSIL[i][2]; return 0; }

    if (fly) px(x - 4, SILL + 1, 9, 1, 'rgba(37,48,28,.10)');
    else {

      px(x - 3, y - 1, 7, 1, 'rgba(37,48,28,.12)');

    var tail = [], ext = s.tail ? [[-9, 9], [-8, 13], [-7, 14], [-6, 11]] : [[-9, 4], [-8, 6], [-7, 6], [-6, 4]];
    for (var q = 0; q < ext.length; q++) {

    for (var o = 0; o < BSILO.length; o++) row(BSILO[o][0], BSILO[o][1], BSILO[o][2], 'rgba(38,29,19,.52)');
    for (var o2 = 0; o2 < tail.length; o2++) row(tail[o2][0], tail[o2][1] - 1, tail[o2][2] + 1, 'rgba(38,29,19,.52)');

    for (var k = 0; k < tail.length; k++) row(tail[k][0], tail[k][1], tail[k][2], s.wing);

    /* 脸颊：跟肚子连成一块 */

    /* 头顶的栗色 */

    row(-12, -5, -3, 'rgba(40,30,18,.20)');
    row(-11, -6, -3, 'rgba(40,30,18,.24)');
    row(-15, -3, -1, 'rgba(251,247,234,.14)');
    row(-12, -7, -6, 'rgba(251,247,234,.10)');
    row(-10, -5, -4, 'rgba(251,247,234,.08)');
    /* 翅与肚的分界 */
    for (var r6 = -14; r6 <= -4; r6++) row(r6, 0, 1, 'rgba(40,30,18,.18)');

    /* 眼睛：醒着是一点黑加高光，睡了就眯成一条线 */
    if (b.act === 'sleep' && !fly) {

    } else {

    row(-16, 9, 10, s.beak);

    /* 腿脚：细而暗，别抢眼睛的颜色 */

    if (fly) {
      row(-4, 1, 1, LEG);
      row(-4, 4, 4, LEG);

    } else {
      var lift = (b.act === 'walk' && Math.sin(b.step) > 0) ? 1 : 0;
      for (var g = -3 + lift; g <= -1; g++) row(g, 1, 1, LEG);
      for (var g2 = -3 + (1 - lift); g2 <= -1; g2++) row(g2, 4, 4, LEG);
      row(-1, 0, 2, LEG);
      row(-1, 3, 6, LEG);
    }

    /* 睡着了，头顶冒个 z */
    if (b.act === 'sleep' && !fly) {
      var zt = (b.t * 0.55) % 1;
      var za = zt < 0.2 ? zt / 0.2 : (1 - zt) / 0.8;
      var zx = x + 7 * f, zy = y - 26 - Math.round(zt * 5);
      ctx.globalAlpha = Math.max(0, Math.min(1, za)) * 0.8;
      px(zx, zy, 3, 1, '#f8f4e4');
      px(zx + 2, zy + 1, 1, 1, '#f8f4e4');
      px(zx, zy + 2, 3, 1, '#f8f4e4');
      ctx.globalAlpha = 1;
    }

    /* 冠羽（戴胜） */
    if (s.crest) {
      row(-22, 3, 6, '#d96f3a');
      row(-23, 4, 5, '#e8925a');
      row(-23, 7, 7, '#e8925a');
      row(-24, 5, 5, '#f0a870');
    }
    /* 眼罩（伯劳） */
    if (s.mask) row(-18, 3, 8, 'rgba(37,48,28,.8)');

    /* 稀有种的微光 */
    if (s.w <= 1.5 && b.phase === 'perch') {
      var a2 = (Math.sin(tNow * 3 + x) + 1) * 0.5;
      if (a2 > 0.6) px(x + 2, y - 25, 1, 1, 'rgba(251,247,234,.9)');
    }
  }

  /* ---------- 绘制：珠颈斑鸠 ----------
     体型约为麻雀的两倍：身宽、胸鼓、头小，尾羽自腰后斜拖，
     颈侧一圈黑底白点的「珍珠」，正是它名字的由来。
     剪影沿用 makeSil 的「圆脑袋 + 蛋身子」并集，描边才是一整圈顺的。 */
  var DV_HX = 7.2, DV_HY = -34.2, DV_HR = 5.7;
  var DV_BX = 0, DV_BY = -19.6, DV_BRX = 14, DV_BRY = 11.2;
  var DSIL = makeSil(DV_HR, DV_BRX, DV_BRY, DV_HX, DV_HY, DV_BX, DV_BY);
  var DSILO = makeSil(DV_HR + 1, DV_BRX + 1, DV_BRY + 1, DV_HX, DV_HY, DV_BX, DV_BY);

  function drawDove(b) {
    var f = b.face || 1;
    var fly = b.phase === 'in' || b.phase === 'out';
    var x = Math.round(b.x);
    var y = Math.round(b.y === undefined ? SILL : b.y);
    if (fly) y += Math.round(Math.sin(b.t * 9) * 2);
    else if (b.act !== 'walk') y += Math.sin(b.t * 1.6) > 0.78 ? -1 : 0;

    function row(r, a, c, col) {
      var xa = x + a * f, xb = x + c * f, t;
      if (xa > xb) { t = xa; xa = xb; xb = t; }
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(xa), y + r, Math.round(xb - xa + 1), 1);
    }
    /* 头部圆在该行的左右，用于分色 */
    function hspan(r) {
      var d = (r - DV_HY) / DV_HR;
      if (Math.abs(d) > 1) return null;
      var w = DV_HR * Math.sqrt(1 - d * d);
      return [Math.round(DV_HX - w), Math.round(DV_HX + w)];
    }

    var LINE = '#2c231e';
    var HEAD = '#b7bdc4', HEAD_HI = '#cbd1d7', HEAD_DK = '#9ba2aa';
    var BODY = '#b48b91', BODY_HI = '#c49da3';
    var BELLY = '#d8b9b1', BELLY_HI = '#e6cfc6';
    var WING = '#8f6e68', WING_DK = '#6f534d', WING_HI = '#a9857d';
    var TAIL = '#7d675e', TAIL_DK = '#5f4a44', TAIL_HI = '#8e776c';
    var NECK = '#332a26', BEAK = '#3b332e', LEG = '#a8453a';

    var i, r, j, a, c2, sp, hs, s, ty, tx1, tx2;

    /* 影子 */
    if (fly) px(x - 10, SILL + 1, 21, 1, 'rgba(37,48,28,.10)');
    else {
      px(x - 12, y - 2, 25, 1, 'rgba(37,48,28,.19)');
      px(x - 8, y - 1, 17, 1, 'rgba(37,48,28,.10)');
    }

    /* 尾羽：自腰后斜拖出去，根部厚、尖端薄，尾上两道分羽线 */
    for (s = 0; s <= 6; s++) {
      ty = -15 + Math.round(s * 0.6);
      tx1 = -11 - s * 2; tx2 = tx1 - 3;
      var th = s < 3 ? 4 : (s < 5 ? 3 : 2);
      row(ty - 1, tx2, tx1, LINE);
      row(ty + th, tx2, tx1, LINE);
      for (i = 0; i < th; i++) row(ty + i, tx2, tx1, i === th - 1 ? TAIL_DK : TAIL);
    }

    for (i = 0; i < DSILO.length; i++) row(DSILO[i][0], DSILO[i][1], DSILO[i][2], LINE);
    for (i = 0; i < DSIL.length; i++) {
      r = DSIL[i][0]; a = DSIL[i][1]; c2 = DSIL[i][2];
      row(r, a, c2, BODY);
      hs = hspan(r);
      if (hs && r <= -29) row(r, Math.max(hs[0], a), Math.min(hs[1], c2), HEAD);
    }

    /* 背与翅：翅覆在体侧，后缘斜着收到腰上 */
    function BR(r) {
      var d = (r - DV_BY) / DV_BRY;
      if (Math.abs(d) > 1) return 0;
      return Math.round(DV_BX + DV_BRX * Math.sqrt(1 - d * d));
    }
    function BL(r) {
      var d = (r - DV_BY) / DV_BRY;
      if (Math.abs(d) > 1) return 0;
      return Math.round(DV_BX - DV_BRX * Math.sqrt(1 - d * d));
    }
    /* 翅膀是一块椭圆羽区，前缘顺着头往下收 */
    var WE = { x: -3.2, y: -20.4, rx: 10.2, ry: 7.8 };
    function wsp(r) {
      var d = (r - WE.y) / WE.ry;
      if (Math.abs(d) > 1) return null;
      var w = WE.rx * Math.sqrt(1 - d * d);
      return [Math.round(WE.x - w), Math.round(WE.x + w)];
    }
    function WR(r) { var p = wsp(r); return p ? p[1] : -8; }
    /* 胸腹：暖白，靠翅一侧压一档过渡 */
    for (r = -27; r <= -9; r++) row(r, WR(r) + 1, BR(r) - 1, BELLY);
    for (r = -24; r <= -11; r++) row(r, WR(r) + 3, BR(r) - 2, BELLY_HI);
    /* 羽区本体 */
    for (r = -28; r <= -13; r++) {
      var wp = wsp(r); if (!wp) continue;

    for (i = 0; i < 2; i++) {
      var ay = -24 + i * 5, ap = wsp(ay); if (!ap) continue;
      var ax0 = ap[0] + 1, ax1 = ap[1] - 1, an = ax1 - ax0;
      if (an < 3) continue;

    if (hp) row(-27, hp[0] + 2, hp[1] - 1, WING_HI);
    for (r = -26; r <= -14; r++) { var q2 = wsp(r); if (q2) row(r, q2[1], q2[1] + 1, 'rgba(43,34,29,.18)'); }

    for (r = -39; r <= -36; r++) { hs = hspan(r); if (hs) row(r, hs[0] + 2, hs[1] - 2, HEAD_HI); }

    for (i = 0; i < coll.length; i++) row(coll[i][0], coll[i][1], coll[i][2], NECK);
    var dots = [[4, -30], [6, -30], [8, -30], [3, -29], [5, -29], [7, -29], [9, -29], [4, -28], [6, -28], [8, -28]];
    for (i = 0; i < dots.length; i++) px(x + dots[i][0] * f, y + dots[i][1], 1, 1, '#e8ded0');

    /* 眼睛：橙圈黑点，睡觉时眯成一线 */
    if (b.act === 'sleep' && !fly) {
      row(-37, 8, 10, 'rgba(43,34,29,.5)');
    } else {
      row(-37, 9, 11, '#d98436');
      row(-36, 9, 11, '#d98436');
      px(x + 10 * f, y - 37, 1, 1, '#15120e');
      px(x + 9 * f, y - 36, 1, 1, '#15120e');
      px(x + 11 * f, y - 36, 1, 1, '#f6f1e6');
    }
    /* 喙：短、暗、微微向下 */
    row(-35, 11, 13, BEAK);
    row(-34, 11, 15, BEAK);
    row(-33, 12, 13, BEAK);

    if (fly) {
      row(-8, 1, 1, LEG);
      row(-8, 5, 5, LEG);
      row(-7, 0, 2, LEG);
      row(-7, 4, 6, LEG);
    } else {
      var lift = (b.act === 'walk' && Math.sin(b.step) > 0) ? 1 : 0;
      for (var g = -7 + lift; g <= -2; g++) row(g, 1, 1, LEG);
      for (var g2 = -7 + (1 - lift); g2 <= -2; g2++) row(g2, 5, 5, LEG);
      row(-1, -1, 2, LEG);
      row(-1, 4, 7, LEG);
    }

    /* 睡着时头顶冒 z */
    if (b.act === 'sleep' && !fly) {
      var zt = (b.t * 0.55) % 1;
      var za = zt < 0.2 ? zt / 0.2 : (1 - zt) / 0.8;
      var zx = x + 11 * f, zy = y - 45 - Math.round(zt * 6);
      ctx.globalAlpha = Math.max(0, Math.min(1, za)) * 0.8;

      px(zx, zy + 2, 3, 1, '#f8f4e4');

  /* ---------- 绘制：羽毛 ---------- */
  function drawFeather(f) {
    var bob = Math.round(Math.sin(tNow * 2.4 + f.seed) * 1.2);
    var x = Math.round(f.x), y = Math.round(f.y) + bob;
    var life = f.life / 30;
    var alpha = life < 0.25 ? (Math.sin(tNow * 9) > 0 ? 0.42 : 0.95) : 1;
    var N = 16, top = y - 11;

      return { ox: -Math.round(i * 0.5), w: w };
    }
    function shape(dx, dy, col) {
      ctx.fillStyle = col;
      for (var i = 0; i < N; i++) {

        ctx.fillRect(x + r.ox + dx, top + i + dy, r.w, 1);
      }
    }

    /* 影子 */
    px(x - 3, y + 6, 8, 1, 'rgba(37,48,28,.15)');

    /* 一圈 1px 描边 */
    shape(-1, 0, 'rgba(43,36,25,.5)');
    shape(1, 0, 'rgba(43,36,25,.5)');
    shape(0, -1, 'rgba(43,36,25,.5)');
    shape(0, 1, 'rgba(43,36,25,.5)');

    /* 羽片本体：纸白 + 鸟羽色做侧边 */
    shape(0, 0, '#fbf7ea');
    ctx.fillStyle = (f.col || '#e8dcc2');
    for (var i = 2; i < 14; i++) {
      var r = span(i);
      ctx.fillRect(x + r.ox + r.w - 2, top + i, 2, 1);
    }
    /* 羽轴 */
    ctx.fillStyle = '#d3c9ad';
    for (var k = 0; k < N; k++) {
      var r2 = span(k);
      ctx.fillRect(x + r2.ox + r2.w - 1, top + k, 1, 1);
    }

    ctx.fillStyle = 'rgba(37,48,28,.10)';
    ctx.fillRect(x - 2, top + 5, 1, 1);
    ctx.fillRect(x - 3, top + 8, 1, 1);
    ctx.fillRect(x - 4, top + 11, 1, 1);

    /* 闪光 */
    var tw = (Math.sin(tNow * 3 + f.seed * 2) + 1) * 0.5;
    if (tw > 0.55) {

      px(x + 4, top + 5, 1, 1, 'rgba(255,252,235,.7)');
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 绘制：飘字 ---------- */

  var SPC = null;
  function buildSpider() {
    var c = document.createElement('canvas');
    c.width = SPIDER.w; c.height = SPIDER.h;
    var g = c.getContext('2d'), y, x, ch;
    for (y = 0; y < SPIDER.h; y++) {

  var SPX = 277;          /* 吊兰左边（26 宽，右框在 308） */

  /* ---------- 旧照片的暖调与暗角 ---------- */
  var VIGC = null;
  function buildVig() {
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    var vg = g.createRadialGradient(W / 2, H * 0.44, 60, W / 2, H * 0.44, 250);
    vg.addColorStop(0, 'rgba(54,30,8,0)');
    vg.addColorStop(0.55, 'rgba(54,30,8,.05)');
    vg.addColorStop(0.82, 'rgba(46,26,6,.18)');
    vg.addColorStop(1, 'rgba(38,20,6,.42)');

  }

  /* ---------- 蕾丝垫（垫在笔记本下面） ---------- */
  function drawDoily(cx, cy, rx, ry) {
    var a, x, y, rr;
    /* 落在木头上的淡影 */
    ell(cx, cy + 1, rx + 0.7, ry, 'rgba(56,34,16,.18)');
    /* 布面：外圈一档米色，内圈提亮，读成两层 */
    ell(cx, cy, rx, ry, 'rgba(224,208,176,.74)');
    ell(cx, cy, rx - 1, ry - 0.8, 'rgba(245,236,214,.92)');
    /* 钩织荷叶边：一条连续的扇贝线，比散点干净 */
    for (a = 0; a < Math.PI * 2; a += 0.085) {
      rr = Math.max(0, Math.sin(a * 6)) * 1.15;
      x = Math.round(cx + Math.cos(a) * (rx + rr));
      y = Math.round(cy + Math.sin(a) * (ry + rr * 0.55));
      px(x, y, 1, 1, 'rgba(238,228,202,.85)');
    }
    /* 内圈一道细绣线 */
    for (a = 0; a < Math.PI * 2; a += 0.075) {
      x = Math.round(cx + Math.cos(a) * (rx - 3.6));
      y = Math.round(cy + Math.sin(a) * (ry - 1.7));
      px(x, y, 1, 1, 'rgba(192,172,134,.20)');
    }
  }

  /* ---------- 留声机（手绘：黄铜喇叭 + 胡桃木箱 + 红标唱片） ---------- */
  var GRAMO = { cx: 240, base: 151 };
  function ell(cx, cy, rx, ry, col) {
    ctx.fillStyle = col;
    var rr = Math.ceil(ry);
    for (var dy = -rr; dy <= rr; dy++) {
      var t = dy / ry;
      if (t < -1 || t > 1) continue;
      var w = Math.round(rx * Math.sqrt(1 - t * t));
      ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
    }
  }

  function drawGramophone(cx, base) {
    var x = cx - 17, top = base - 34;
    var i, t, w, cxx, col;

    px(x + 4, base + 1, 27, 1, 'rgba(24,14,8,.30)');

    /* 喇叭：直边锥体，逐行收窄；左缘受光，右缘压暗 */
    for (i = 0; i <= 15; i++) {
      t = i / 15;
      w = Math.round(18 - t * 13);          /* 18 → 5 */
      cxx = Math.round(x + 11 + t * 9);     /* 中心右移 */
      col = t < 0.3 ? '#cba75f' : (t < 0.72 ? '#b28e4c' : '#95733c');
      px(cxx - (w >> 1), top + 3 + i, w, 1, col);
      px(cxx - (w >> 1), top + 3 + i, 1, 1, '#dcc07f');     /* 左缘高光 */
      px(cxx + (w >> 1) - 1, top + 3 + i, 1, 1, '#7d5c2c'); /* 右缘暗边 */
    }

    /* 喇叭口：铜圈压住锥体顶端，里面是暗腔 */
    ell(x + 10, top + 7, 9.7, 7.4, '#c9a55f');
    ell(x + 10, top + 7, 8.7, 6.4, '#ab8746');
    ell(x + 9.4, top + 6.6, 7.3, 5.3, '#6b4a24');
    ell(x + 9.0, top + 6.4, 5.6, 3.9, '#42270f');
    ell(x + 8.6, top + 6.2, 3.2, 2.2, '#281005');
    /* 口沿上的一道反光，把黄铜的弧读出来 */
    arc(x + 9.6, top + 6.6, 8.9, -2.72, -0.5, '#f4dea8');
    arc(x + 9.6, top + 6.6, 8.0, -2.6, -0.9, '#dcc07f');
    px(x + 2, top + 1, 6, 1, '#f0daa4');
    px(x + 1, top + 3, 2, 5, '#e6cd95');

    /* 细管：从锥体末端落到唱片上 */
    px(x + 21, top + 19, 2, 2, '#93703a');
    px(x + 22, top + 21, 2, 3, '#8a6a34');
    px(x + 22, top + 21, 1, 3, '#b28e4c');

    /* 唱片 */
    ell(x + 16, top + 25, 9.2, 2.8, '#221d19');
    ell(x + 16, top + 25, 8.2, 1.9, '#2b2520');
    ell(x + 16, top + 25, 2.6, 1, '#a8452e');
    px(x + 15, top + 25, 1, 1, '#d8b878');
    px(x + 10, top + 24, 4, 1, 'rgba(216,184,120,.30)');

    /* 唱臂 */
    px(x + 25, top + 21, 1, 4, '#c9a55f');
    px(x + 24, top + 20, 3, 1, '#e0c489');
    px(x + 26, top + 24, 2, 1, '#8a6a34');

    /* 木箱 */
    px(x + 3, top + 27, 28, 8, '#5a3a22');
    px(x + 3, top + 27, 28, 1, '#6f4a2e');
    px(x + 3, top + 28, 1, 7, '#7a5530');
    px(x + 30, top + 28, 1, 7, '#3f2510');
    px(x + 4, top + 30, 26, 1, '#8a6535');
    px(x + 4, top + 34, 26, 1, '#3a2410');
    px(x + 4, top + 32, 26, 1, '#b08d4f');
    px(x + 5, top + 30, 2, 2, '#c9a55f');
    px(x + 27, top + 30, 2, 2, '#c9a55f');

    /* 摇柄 */
    px(x + 31, top + 29, 2, 1, '#c9a55f');
    px(x + 32, top + 26, 1, 4, '#b08d4f');
    px(x + 32, top + 26, 1, 1, '#efd79f');
  }

  /* ---------- 摊开的笔记本 ---------- */
  var NOTEBOOK = { cx: 197, base: 151, w: 38, h: 13 };
  function drawNotebook(cx, base) {
    var x = cx - 19, y = base - 12;

    px(x + 1, base + 1, 37, 1, 'rgba(30,20,10,.24)');

    for (var i = 0; i < 3; i++) {

      px(x + 23, y + 4 + i * 2, 11, 1, 'rgba(120,108,82,.30)');

    /* 红书签从书脊垂下来，压在右页上 */
    px(x + 24, y + 1, 2, 7, '#b8553f');
